<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header-css}"></head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="container">
    <h3 class="mb-4">Мої оголошення</h3>

    <ul class="nav nav-pills mb-3">
        <li class="nav-item">
            <a class="nav-link"
               th:classappend="${selectedType == null || selectedType == ''} ? 'active bg-success' : 'text-success'"
               th:href="@{/my-items(category=${selectedCategory})}">
                Всі
            </a>
        </li>
        <li class="nav-item ms-2">
            <a class="nav-link"
               th:classappend="${selectedType == 'LOST'} ? 'active bg-success' : 'text-success'"
               th:href="@{/my-items(type='LOST', category=${selectedCategory})}">
                Загублені
            </a>
        </li>
        <li class="nav-item ms-2">
            <a class="nav-link"
               th:classappend="${selectedType == 'FOUND'} ? 'active bg-success' : 'text-success'"
               th:href="@{/my-items(type='FOUND', category=${selectedCategory})}">
                Знайдені
            </a>
        </li>
    </ul>

    <div class="mb-4 d-flex flex-wrap gap-2">
        <a th:href="@{/my-items(type=${selectedType})}"
           class="btn btn-sm rounded-pill"
           th:classappend="${selectedCategory == null || selectedCategory == ''} ? 'btn-dark' : 'btn-outline-dark'">
            Всі категорії
        </a>

        <a th:each="cat : ${categories}"
           th:href="@{/my-items(type=${selectedType}, category=${cat.name()})}"
           class="btn btn-sm rounded-pill"
           th:classappend="${selectedCategory == cat.name()} ? 'btn-dark' : 'btn-outline-dark'"
           th:text="${cat.displayName}">
            Категорія
        </a>
    </div>

    <div class="list-group shadow-sm">
        <div th:each="item : ${items}" class="list-group-item d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <img th:src="${item.imageUrl != null && !item.imageUrl.isEmpty() ? item.imageUrl : 'https://via.placeholder.com/100'}"
                     class="rounded me-3"
                     style="width: 60px; height: 60px; object-fit: cover;"
                     alt="item">

                <div>
                    <h5 class="mb-1">
                        <a th:href="@{/item/{id}(id=${item.id})}" class="text-decoration-none text-dark" th:text="${item.title}">Назва</a>
                    </h5>
                    <small class="text-muted">
                        <span th:text="${item.location}">Місто</span> ·
                        <span th:text="${#temporals.format(item.date, 'dd.MM.yyyy')}">Дата</span>
                    </small>
                    <div class="mt-1">
                         <span class="badge"
                               th:classappend="${item.type.name() == 'LOST' ? 'bg-danger' : 'bg-success'}"
                               th:text="${item.type.name() == 'LOST' ? 'Загублено' : 'Знайдено'}">Тип
                         </span>
                        <span class="badge bg-secondary" th:text="${item.category.displayName}">Категорія</span>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2">
                <a th:href="@{/item/{id}/edit(id=${item.id})}" class="btn btn-sm btn-outline-secondary">Редагувати</a>

                <form th:action="@{/item/{id}/delete(id=${item.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Ви впевнені, що хочете видалити це оголошення?')">
                        Видалити
                    </button>
                </form>
            </div>
        </div>

        <div th:if="${items.isEmpty()}" class="p-4 text-center text-muted">
            У вас поки немає оголошень у цій категорії.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
