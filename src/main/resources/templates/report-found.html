<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header-css}"></head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="container" style="max-width:600px;">
    <div class="card shadow-sm p-4">
        <h3 class="text-center mb-4">Я знайшов річ</h3>

        <form>
            <div class="mb-3">
                <label class="form-label fw-bold small">Ваше імʼя</label>
                <input type="text" class="form-control" placeholder="Імʼя">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small">Контактний телефон</label>
                <input type="tel" class="form-control" placeholder="+380...">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small">Де знайдено річ</label>
                <input type="text" class="form-control" placeholder="Місто, місце">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small">Опис</label>
                <textarea class="form-control" rows="4"></textarea>
            </div>

            <div class="mb-3">
                <button type="button" class="btn btn-light w-100 border">
                    📁 Завантажити фото
                </button>
            </div>

            <button class="btn btn-custom w-100 py-2">
                Опублікувати
            </button>
        </form>
    </div>
</div>

<div th:replace="~{fragments :: footer-scripts}"></div>
</body>
</html>
