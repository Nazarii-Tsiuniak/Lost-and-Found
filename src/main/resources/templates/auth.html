<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід та Реєстрація - Lost & Found</title>
    <th:block th:replace="~{fragments :: header-css}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body.auth-page {
            background-color: #f8f9fa;
        }

        .auth-wrapper {
            min-height: calc(100vh - 100px); /* Висота екрана мінус висота навбара */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%; /* Додаємо для правильної поведінки в flex */
        }

        .auth-header {
            background-color: var(--main-green);
            padding: 30px 20px 0 20px;
        }

        .auth-header h4 {
            color: white;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
        }

        .nav-tabs .nav-link {
            border: none;
            color: rgba(255,255,255,0.7) !important;
            padding: 12px 25px;
        }

        .nav-tabs .nav-link.active {
            background-color: white !important;
            color: var(--main-green) !important;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        .btn-custom {
            padding: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body class="auth-page">

<div th:replace="~{fragments :: navbar}"></div>

<div class="auth-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card">

                    <div class="auth-header">
                        <h4>Вітаємо в Lost & Found</h4>

                        <div th:if="${param.registered}" class="alert alert-success small py-2 mb-3"><i class="fas fa-check-circle me-2"></i>Реєстрація успішна!</div>
                        <div th:if="${param.error}" class="alert alert-danger small py-2 mb-3"><i class="fas fa-exclamation-circle me-2"></i>Помилка входу або реєстрації.</div>

                        <ul class="nav nav-tabs nav-fill border-0" id="authTab" role="tablist">
                            <li class="nav-item">
                                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">Вхід</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">Реєстрація</button>
                            </li>
                        </ul>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="login">
                                <form th:action="@{/login}" method="post">
                                    <div class="mb-4">
                                        <label class="form-label small fw-bold text-muted">Email</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                            <input type="email" name="username" class="form-control" required>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label small fw-bold text-muted">Пароль</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                            <input type="password" name="password" class="form-control" required>
                                        </div>
                                    </div>
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" name="remember-me" id="rememberMe" class="form-check-input">
                                        <label class="form-check-label small text-muted" for="rememberMe">Запам'ятати мене</label>
                                    </div>
                                    <button type="submit" class="btn btn-custom w-100">Увійти</button>
                                </form>
                            </div>

                            <div class="tab-pane fade" id="register">
                                <form th:action="@{/register}" method="post">
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">Email</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                            <input type="email" name="email" class="form-control" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">Пароль</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                            <input type="password" name="password" class="form-control" required>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label small fw-bold text-muted">Підтвердження</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-check"></i></span>
                                            <input type="password" name="confirmPassword" class="form-control" required>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-custom w-100">Створити акаунт</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <p class="text-center mt-4 text-muted small">© 2026 Lost & Found. Всі права захищено.</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
