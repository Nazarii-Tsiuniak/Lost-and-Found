<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header-css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --main-green: #5d7c5a; --dark-green: #4a6347; }
        .navbar-custom { background-color: var(--main-green); }
        .btn-custom { background-color: var(--main-green); color: white; border: none; }
        .btn-custom:hover { background-color: var(--dark-green); color: white; }
        .card-img-left { width: 100px; height: 100px; object-fit: cover; border-radius: 5px; }

        .navbar-nav .nav-link { color: rgba(255,255,255,0.8) !important; }
        .navbar-nav .nav-link.active { color: white !important; font-weight: bold; }
    </style>
</head>
<body>
<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="https://cdn-icons-png.flaticon.com/512/812/812850.png"
                 width="30" height="30"
                 class="me-2"
                 style="filter: invert(1);">
            Lost & Found
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Left part -->
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/">Головна</a>

                <a class="nav-link"
                   href="/my-items"
                   sec:authorize="isAuthenticated()">
                    Мої речі
                </a>

                <a class="nav-link"
                   href="/profile"
                   sec:authorize="isAuthenticated()">
                    Профіль
                </a>
            </div>

            <!-- Right part -->
            <div class="navbar-nav align-items-center gap-2">

                <a class="btn btn-outline-light btn-sm"
                   href="/login"
                   sec:authorize="!isAuthenticated()">
                    Увійти
                </a>

                <form th:action="@{/logout}"
                      method="post"
                      sec:authorize="isAuthenticated()">
                    <button class="btn btn-light btn-sm">
                        Вийти
                    </button>
                </form>

                <div class="dropdown">
                    <button class="btn btn-light btn-sm px-3 dropdown-toggle"
                            type="button"
                            id="reportDropdown"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">
                        + Подати оголошення
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="reportDropdown">
                        <li>
                            <a class="dropdown-item d-flex align-items-center gap-2" href="/report/found">
                                <span>🔍</span> Я знайшов річ
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item d-flex align-items-center gap-2" href="/report/lost">
                                <span>📢</span> Я загубив річ
                            </a>
                        </li>
                    </ul>
                </div>

            </div>
        </div>
    </div>
</nav>

<div th:fragment="category-select(name)" class="mb-3">
    <label class="form-label fw-bold small">Категорія</label>
    <select th:name="${name}" class="form-select" required>
        <option value="" disabled selected>Оберіть категорію...</option>
        <option th:each="cat : ${T(com.pnuDev.LostAndFound.model.Category).values()}"
                th:value="${cat.name()}"
                th:text="${cat.displayName}">
        </option>
    </select>
</div>

<th:block th:fragment="footer-scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.querySelectorAll('input[type="file"]').forEach(input => {
            input.addEventListener('change', function() {
                const maxSize = 2 * 1024 * 1024;

                if (this.files[0] && this.files[0].size > maxSize) {
                    alert('Файл занадто великий! Будь ласка, виберіть фото менше 2MB.');
                    this.value = '';
                }
            });
        });
    </script>
</th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
