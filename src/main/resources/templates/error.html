<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header-css}">
    <title>Помилка - Lost & Found</title>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<div class="container text-center" style="margin-top: 100px;">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="display-1 text-muted mb-4">Oops!</div>
            <h2 class="mb-3" th:text="${status != null} ? 'Помилка ' + ${status} : 'Сталася помилка'">Сталася помилка</h2>

            <p class="lead mb-4">
                <span th:if="${status == 404}">Сторінку не знайдено. Можливо, вона була видалена або ніколи не існувала.</span>
                <span th:if="${status == 500}">Сталася внутрішня помилка сервера. Ми вже працюємо над її виправленням.</span>
                <span th:if="${status != 404 && status != 500}">Вибачте, щось пішло не так. Спробуйте пізніше.</span>
            </p>

            <div th:if="${message}" class="alert alert-light border small text-muted mb-4">
                Деталі: <span th:text="${message}">Опис помилки</span>
            </div>

            <a href="/" class="btn btn-custom px-5 py-2">На головну</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer-scripts}"></div>
</body>
</html>
