<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header-css}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Загублені та знайдені речі</h2>
        <span class="text-muted" th:text="'Показано: ' + ${items.size()}">Показано: 0</span>
    </div>

    <ul class="nav nav-pills mb-3">
        <li class="nav-item">
            <a class="nav-link"
               th:classappend="${selectedType == null || selectedType == ''} ? 'active bg-success' : 'text-success'"
               th:href="@{/(category=${selectedCategory})}">
                Всі
            </a>
        </li>
        <li class="nav-item ms-2">
            <a class="nav-link"
               th:classappend="${selectedType == 'LOST'} ? 'active bg-success' : 'text-success'"
               href="/?type=LOST">
                Загублені
            </a>
        </li>
        <li class="nav-item ms-2">
            <a class="nav-link"
               th:classappend="${selectedType == 'FOUND'} ? 'active bg-success' : 'text-success'"
               href="/?type=FOUND">
                Знайдені
            </a>
        </li>
    </ul>
    <div class="mb-4 d-flex flex-wrap gap-2">
        <a th:href="@{/(type=${selectedType})}"
           class="btn btn-sm rounded-pill"
           th:classappend="${selectedCategory == null || selectedCategory == ''} ? 'btn-dark' : 'btn-outline-dark'">
            Всі категорії
        </a>

        <a th:each="cat : ${categories}"
           th:href="@{/(type=${selectedType}, category=${cat.name()})}"
           class="btn btn-sm rounded-pill"
           th:classappend="${selectedCategory == cat.name()} ? 'btn-dark' : 'btn-outline-dark'"
           th:text="${cat.displayName}">
            Категорія
        </a>
    </div>

    <div class="list-group shadow-sm">
        <div th:each="item : ${items}" class="list-group-item d-flex align-items-center justify-content-between p-3 border-start-0 border-end-0">
            <div class="d-flex align-items-center">
                <img th:src="${item.imageUrl != null ? item.imageUrl : 'https://via.placeholder.com/100'}"
                     class="card-img-left me-3" alt="item">
                <div>
                    <h5 class="mb-1" th:text="${item.title}">Назва речі</h5>
                    <p class="mb-0 text-muted small">
                        <span th:text="${item.location}">Місто</span> |
                        <span th:text="${#temporals.format(item.date, 'dd MMMM, yyyy')}">Дата</span>
                    </p>

                    <span class="badge"
                          th:classappend="${item.type.name() == 'LOST' ? 'bg-danger' : 'bg-success'}"
                          th:text="${item.type.name() == 'LOST' ? 'Загублено' : 'Знайдено'}">Тип
                    </span>

                    <span class="badge bg-secondary me-1"
                          th:text="${item.category.displayName}"> Категорія
                    </span>
                </div>
            </div>
            <a th:href="@{/item/{id}(id=${item.id})}" class="btn btn-custom px-4">Переглянути</a>
        </div>

        <div th:if="${items.isEmpty()}" class="p-5 text-center">
            <p class="text-muted">Оголошень поки немає.</p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
